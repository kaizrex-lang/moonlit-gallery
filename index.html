<script>
const img = {
 mountain:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85',

 road:'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=900&q=85'

const seed = [
 ['A quiet morning',img.mountain,'Oct 18, 2026','Nature','A reminder that the world is larger than the things that worry me.'],
 ['Where the sky meets water',img.lake,'Oct 17, 2026','Nature','A little stillness at the edge of the day.'],
 ['Small wonders',img.flower,'Oct 16, 2026','Nature','Even the smallest things seem to hold an entire universe.'],
 ['Moon notes',img.moon,'Oct 15, 2026','Night skies','The moon makes silence feel less empty.'],

 ['Into the green',img.forest,'Oct 12, 2026','Nature','A path, a breath, and nowhere else to be.'],
 ['Blue hour',img.sea,'Oct 10, 2026','Nature','The last light always leaves something behind.'],
 ['Lights below',img.city,'Oct 9, 2026','Travel','Every window holds a story I will never know.'],

].map((x,i)=>({id:'seed'+i,title:x[0],src:x[1],date:x[2],album:x[3],note:x[4],favorite:i===2||i===3,uploaded:false}));
let photos=[...seed], albums=[{name:'Nature',cover:img.mountain},{name:'Travel',cover:img.temple},{name:'Night skies',cover:img.moon}], writings=[], books=[], quotes=[], activePage='Photos', searchTerm='', selectedPhoto=null, selectedIds=new Set(), viewMode='grid', toastTimer;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(page){activePage=page;selectedIds.clear();$('#globalSearch').value='';searchTerm='';render();window.scrollTo({top:0,behavior:'smooth'})}
function setHead(title,subtitle,eyebrow='YOUR PERSONAL ARCHIVE'){ $('#pageTitle').textContent=title;$('#pageSubtitle').textContent=subtitle;$('#greetingEyebrow').textContent=eyebrow;$('#mainAction').textContent=({'Photos':'＋ Add photos','Albums':'＋ Create album',"Writer's Corner":'＋ New writing',"Reader's Library":'＋ Add book','Quotes':'＋ Save a quote','Connections':'＋ New connection','Favorites':'＋ Add photos','Settings':'Settings'}[activePage]||'＋ Create');}
function photoCard(p,i){return '<article class="photo-card '+(selectedIds.has(p.id)?'selected':'')+'" style="--i:'+i+'" data-photo="'+safe(p.id)+'" tabindex="0" aria-label="Open '+safe(p.title)+'"><button class="photo-check" data-select="'+safe(p.id)+'" aria-label="Select photo">'+(selectedIds.has(p.id)?'✓':'')+'</button><img src="'+safe(p.src)+'" alt="'+safe(p.title)+'" loading="lazy"><div class="photo-caption">'+safe(p.title)+'</div></article>'}
function photoSection(list){if(!list.length)return '<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg><div>No photos here yet</div><p>Add photos from your device to begin your collection.</p><button class="primary" data-action="upload">＋ Add photos</button></div>';const groups={};list.forEach(p=>(groups[p.date]??=[]).push(p));return Object.entries(groups).map(([date,items])=>'<div class="date-heading">'+safe(date)+'</div><div class="photo-grid">'+items.map((p,i)=>photoCard(p,i)).join('')+'</div>').join('')}
function renderPhotos(){let list=photos.filter(p=>activePage!=='Favorites'||p.favorite);if(searchTerm){const q=searchTerm.toLowerCase();list=list.filter(p=>(p.title+' '+p.note+' '+p.album+' '+p.date).toLowerCase().includes(q))}return '<div class="toolbar"><h2>'+ (activePage==='Favorites'?'Favorite photos':'All photos')+' <span class="muted" style="font-size:12px;font-weight:400">· '+list.length+'</span></h2><div class="toolbar-right">'+(selectedIds.size?'<button class="secondary" data-action="selected-album">Add to album</button><button class="secondary" data-action="delete-selected">Delete ('+selectedIds.size+')</button>':'')+'<div class="segmented"><button class="'+(viewMode==='grid'?'active':'')+'" data-view="grid" aria-label="Grid view">▦</button><button class="'+(viewMode==='list'?'active':'')+'" data-view="list" aria-label="List view">☷</button></div></div></div>'+(viewMode==='grid'?photoSection(list):'<div class="book-list">'+list.map(p=>'<div class="list-row"><img src="'+safe(p.src)+'" style="width:68px;height:68px;object-fit:cover;border-radius:9px"><div class="grow"><h3>'+safe(p.title)+'</h3><p>'+safe(p.date)+' · '+safe(p.album)+'</p><p>'+safe(p.note)+'</p></div><button class="secondary" data-open="'+safe(p.id)+'">Open</button></div>').join('')+'</div>')}
function renderAlbums(){return '<div class="toolbar"><h2>Your collections</h2><div class="toolbar-right"><button class="primary" data-action="new-album">＋ Create album</button></div></div><div class="albums-grid">'+albums.map(a=>{const n=photos.filter(p=>p.album===a.name).length;return '<article class="album-card" data-album="'+safe(a.name)+'"><img class="album-cover" src="'+safe(a.cover)+'" alt=""><div class="album-info"><div><h3>'+safe(a.name)+'</h3><p>'+n+' '+(n===1?'photo':'photos')+'</p></div><span class="muted">↗</span></div></article>'}).join('')+'</div>'}
function renderWriting(){return '<div class="toolbar"><h2>Your words, kept safe</h2><button class="primary" data-action="new-writing">＋ New writing</button></div><p class="muted" style="margin:-6px 0 20px">Poems, fragments, unfinished ideas and things you do not want to forget.</p><div class="writing-list">'+(writings.length?writings.map(w=>'<article class="list-row"><div class="feature-icon"><svg class="icon" viewBox="0 0 24 24"><path d="m12 20 9-9-8-8-9 9v8Z"/></svg></div><div class="grow"><h3>'+safe(w.title||'Untitled thought')+'</h3><p>'+safe(w.date)+'</p><p>'+safe(w.body.slice(0,180))+'</p></div><button class="icon-btn" data-edit-writing="'+safe(w.id)+'" aria-label="Edit writing">✎</button></article>').join(''):'<div class="empty-state"><div class="serif" style="font-size:24px;color:#e2eaff">“Every idea deserves a place to land.”</div><p>Your first poem or thought can begin here.</p><button class="primary" data-action="new-writing">Write something</button></div>')+'</div>'}
function renderBooks(){return '<div class="toolbar"><h2>Your reading shelf</h2><button class="primary" data-action="new-book">＋ Add book</button></div><p class="muted" style="margin:-6px 0 20px">Keep track of what you read and what stays with you.</p><div class="book-list">'+(books.length?books.map(b=>'<article class="list-row"><div class="feature-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5Z"/></svg></div><div class="grow"><h3>'+safe(b.title)+'</h3><p>'+safe(b.author||'Author not added')+' · '+safe(b.status)+'</p><p>'+safe(b.notes||'No reading notes yet.')+'</p></div><button class="icon-btn" data-edit-book="'+safe(b.id)+'" aria-label="Edit book">✎</button></article>').join(''):'<div class="empty-state"><div class="serif" style="font-size:24px;color:#e2eaff">A shelf for the books that change you.</div><p>Add a book, keep your page, and save the thoughts you want to return to.</p><button class="primary" data-action="new-book">Add your first book</button></div>')+'</div>'}
function renderQuotes(){return '<div class="toolbar"><h2>Words worth keeping</h2><button class="primary" data-action="new-quote">＋ Save a quote</button></div>'+(quotes.length?quotes.map(q=>'<div class="quote-card"><blockquote>“'+safe(q.text)+'”</blockquote><cite>— '+safe(q.source||'A thought to remember')+(q.page?' · p. '+safe(q.page):'')+'</cite></div>').join(''):'<div class="empty-state"><div class="serif" style="font-size:24px;color:#e2eaff">Keep the sentences that find you.</div><p>Save a quote with its book, author and page number.</p><button class="primary" data-action="new-quote">Save a quote</button></div>')}
function renderConnections(){return '<div class="toolbar"><h2>Connections</h2><span class="tag">Your idea garden</span></div><p class="muted">A place to connect the things that belong together: a photograph, a memory, a book quote, and a line you wrote.</p><div class="feature-grid"><article class="feature-card"><div class="feature-icon">⌁</div><h3>Start with a photograph</h3><p>Open a photo and add a note about why it matters.</p><button class="secondary" data-nav="Photos">Browse photos</button></article><article class="feature-card"><div class="feature-icon">✎</div><h3>Connect your words</h3><p>Write a thought inspired by a place, image or moment.</p><button class="secondary" data-nav="Writer&#39;s Corner">Open writing</button></article><article class="feature-card"><div class="feature-icon">▤</div><h3>Keep a passage</h3><p>Save a quote and the book it came from.</p><button class="secondary" data-nav="Quotes">Open quotes</button></article><article class="feature-card"><div class="feature-icon">☾</div><h3>Make meaning</h3><p>Later, we can add explicit links between memories and ideas.</p><span class="tag">Connection editor planned</span></article></div>'}
function renderSettings(){return '<div class="toolbar"><h2>Your space</h2></div><div class="feature-grid"><article class="feature-card"><div class="feature-icon">☾</div><h3>Moonlit welcome</h3><p>Return to the night-sky introduction.</p><button class="secondary" id="settingsWelcome">Preview welcome screen</button></article><article class="feature-card"><div class="feature-icon">⇧</div><h3>Photo library</h3><p>'+photos.length+' photos in this current browser session. Sample images are included as visual placeholders.</p><button class="secondary" data-action="upload">Add photos</button></article><article class="feature-card"><div class="feature-icon">⌁</div><h3>Data & privacy</h3><p>This first version is a front-end prototype. Login, cloud backup and private online storage are not connected yet.</p><span class="tag">Backend setup next</span></article><article class="feature-card"><div class="feature-icon">✦</div><h3>Export your notes</h3><p>Download your writing, books and quotes from this session as a JSON file.</p><button class="secondary" data-action="export">Export data</button></article></div>'}
function render(){setHead(...( {Photos:['A little universe of yours.','Keep the moments. Keep the meaning.'],Albums:['Collections for every kind of memory.','A different shelf for every story.'],Favorites:['The ones you return to.','Little things worth keeping close.'],"Writer's Corner":['Words that belong to you.','Drafts, fragments, poems and possibilities.'],"Reader's Library":['A shelf for your inner world.','Books read, books loved, thoughts kept.'],Quotes:['Sentences that stay with you.','Keep the words that opened a door.'],Connections:['Follow the threads between ideas.','Memories, books and thoughts can belong together.'],Settings:['Make this space your own.','A few details about your personal archive.']}[activePage]||['A little universe of yours.','Keep the moments. Keep the meaning.']));const c=$('#content');if(activePage==='Photos'||activePage==='Favorites')c.innerHTML=renderPhotos();else if(activePage==='Albums')c.innerHTML=renderAlbums();else if(activePage==="Writer's Corner")c.innerHTML=renderWriting();else if(activePage==="Reader's Library")c.innerHTML=renderBooks();else if(activePage==='Quotes')c.innerHTML=renderQuotes();else if(activePage==='Connections')c.innerHTML=renderConnections();else c.innerHTML=renderSettings();$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===activePage));}
function openModal(html,wide=false){$('#modalRoot').innerHTML='<div class="overlay" id="overlay"><section class="modal '+(wide?'wide':'')+'" role="dialog" aria-modal="true">'+html+'</section></div>';$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});const f=$('#modalRoot input, #modalRoot textarea');if(f)setTimeout(()=>f.focus(),80)}
function closeModal(){$('#modalRoot').innerHTML=''}
function openPhoto(id){const p=photos.find(x=>x.id===id);if(!p)return;selectedPhoto=id;openModal('<div class="modal-head"><h2>Photo details</h2><button class="icon-btn" data-action="close" aria-label="Close">✕</button></div><div class="viewer"><div class="viewer-image-wrap"><img class="viewer-image" src="'+safe(p.src)+'" alt="'+safe(p.title)+'"></div><div class="viewer-side"><div><div class="eyebrow">'+safe(p.date)+'</div><h3 style="margin-top:6px">'+safe(p.title)+'</h3><p class="muted" style="font-size:12px">'+safe(p.album||'Unsorted')+'</p></div><div class="viewer-actions"><button class="secondary" data-action="favorite" data-id="'+safe(p.id)+'">'+(p.favorite?'♥ Favorited':'♡ Favorite')+'</button><button class="secondary" data-action="edit-note" data-id="'+safe(p.id)+'">✎ Edit note</button><button class="secondary" data-action="download" data-id="'+safe(p.id)+'">↓ Download</button></div><div class="note-box"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:12px">Your story</strong><button class="icon-btn" data-action="edit-note" data-id="'+safe(p.id)+'" aria-label="Edit note">✎</button></div><p>'+(p.note?safe(p.note):'<span class="muted">Add the story behind this photo…</span>')+'</p></div><div class="field"><label for="photoTitle">Photo title</label><input id="photoTitle" value="'+safe(p.title)+'"></div><div class="field"><label for="photoAlbum">Album</label><select id="photoAlbum" style="width:100%;background:#0a111a;border:1px solid #2a394c;border-radius:11px;color:var(--text);padding:12px"><option value="">Unsorted</option>'+albums.map(a=>'<option '+(a.name===p.album?'selected':'')+' value="'+safe(a.name)+'">'+safe(a.name)+'</option>').join('')+'</select></div><button class="primary" style="width:100%" data-action="save-photo" data-id="'+safe(p.id)+'">Save changes</button><button class="secondary" style="width:100%;margin-top:8px" data-action="delete-photo" data-id="'+safe(p.id)+'">Move to trash / remove</button></div></div>',true)}
function noteModal(id){const p=photos.find(x=>x.id===id);if(!p)return;openModal('<div class="modal-head"><h2>Write the story</h2><button class="icon-btn" data-action="close">✕</button></div><div style="display:flex;gap:12px;align-items:center;margin-bottom:18px"><img src="'+safe(p.src)+'" style="width:72px;height:72px;object-fit:cover;border-radius:12px"><div><strong>'+safe(p.title)+'</strong><p class="muted" style="margin:3px 0;font-size:12px">'+safe(p.date)+'</p></div></div><div class="field"><label for="noteTitle">A title for this memory</label><input id="noteTitle" value="'+safe(p.title)+'"></div><div class="field"><label for="noteText">What was this photo really about?</label><textarea id="noteText" placeholder="Where were you? What were you thinking? Why do you want to remember this?">'+safe(p.note)+'</textarea></div><div class="modal-actions"><button class="secondary" data-action="close">Cancel</button><button class="primary" data-action="save-note" data-id="'+safe(id)+'">Save memory</button></div>')}
function simpleModal(title,fields,saveAction,editId){openModal('<div class="modal-head"><h2>'+title+'</h2><button class="icon-btn" data-action="close">✕</button></div>'+fields+'<div class="modal-actions"><button class="secondary" data-action="close">Cancel</button><button class="primary" data-action="'+saveAction+'" '+(editId?'data-id="'+safe(editId)+'"':'')+'>Save</button></div>')}
function newWriting(id){const w=id?writings.find(x=>x.id===id):null;simpleModal(w?'Edit writing':'A page of your own','<div class="field"><label for="wTitle">Title</label><input id="wTitle" placeholder="A thought, a poem, a beginning…" value="'+safe(w?.title||'')+'"></div><div class="field"><label for="wBody">Your words</label><textarea id="wBody" style="min-height:220px" placeholder="Write freely. This is your space.">'+safe(w?.body||'')+'</textarea></div>',w?'save-writing-edit':'save-writing',id)}
function newBook(id){const b=id?books.find(x=>x.id===id):null;simpleModal(b?'Edit book':'Add to your reading shelf','<div class="field"><label for="bTitle">Book title</label><input id="bTitle" placeholder="Title" value="'+safe(b?.title||'')+'"></div><div class="field"><label for="bAuthor">Author</label><input id="bAuthor" placeholder="Author name" value="'+safe(b?.author||'')+'"></div><div class="field"><label for="bStatus">Reading status</label><select id="bStatus" style="width:100%;background:#0a111a;border:1px solid #2a394c;border-radius:11px;color:var(--text);padding:12px"><option '+(!b||b.status==='Want to read'?'selected':'')+'>Want to read</option><option '+(b?.status==='Reading'?'selected':'')+'>Reading</option><option '+(b?.status==='Finished'?'selected':'')+'>Finished</option></select></div><div class="field"><label for="bNotes">Your thoughts</label><textarea id="bNotes" placeholder="What do you want to remember about this book?">'+safe(b?.notes||'')+'</textarea></div>',b?'save-book-edit':'save-book',id)}
function newQuote(){simpleModal('Save a quote','<div class="field"><label for="qText">Quote</label><textarea id="qText" placeholder="The words that stayed with you…"></textarea></div><div class="field"><label for="qSource">Book / author / source</label><input id="qSource" placeholder="Where did you find it?"></div><div class="field"><label for="qPage">Page number (optional)</label><input id="qPage" placeholder="e.g. 42"></div>','save-quote')}
function newAlbum(){simpleModal('Create an album','<div class="field"><label for="aName">Album name</label><input id="aName" placeholder="e.g. Quiet places"></div><p class="muted" style="font-size:12px">You can assign photos to this album from their details.</p>','save-album')}
function upload(){ $('#fileInput').click() }
function downloadPhoto(id){const p=photos.find(x=>x.id===id);if(!p)return;if(p.uploaded){const a=document.createElement('a');a.href=p.src;a.download=(p.title||'moonlit-photo')+'.jpg';a.click();return}fetch(p.src).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(p.title||'moonlit-photo')+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}).catch(()=>window.open(p.src,'_blank','noopener'))}
function exportData(){const data={writings,books,quotes,albums:albums.map(a=>a.name),photoNotes:photos.map(p=>({title:p.title,date:p.date,album:p.album,note:p.note,favorite:p.favorite}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moonlit-gallery-notes.json';a.click();URL.revokeObjectURL(url);toast('Your notes export has been prepared.')}
document.addEventListener('click',e=>{
 const navBtn=e.target.closest('[data-nav]');if(navBtn){e.preventDefault();nav(navBtn.dataset.nav);return}
 const card=e.target.closest('[data-photo]');if(card&&!e.target.closest('[data-select]')){openPhoto(card.dataset.photo);return}
 const select=e.target.closest('[data-select]');if(select){e.stopPropagation();const id=select.dataset.select;selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);render();return}
 const open=e.target.closest('[data-open]');if(open){openPhoto(open.dataset.open);return}
 const album=e.target.closest('[data-album]');if(album){const name=album.dataset.album;activePage='Photos';searchTerm='';render();$('#content').innerHTML='<div class="toolbar"><h2>'+safe(name)+'</h2><button class="secondary" data-nav="Albums">← All albums</button></div>'+photoSection(photos.filter(p=>p.album===name));$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav==='Albums'));return}
 const editW=e.target.closest('[data-edit-writing]');if(editW){newWriting(editW.dataset.editWriting);return}
 const editB=e.target.closest('[data-edit-book]');if(editB){newBook(editB.dataset.editBook);return}
 const v=e.target.closest('[data-view]');if(v){viewMode=v.dataset.view;render();return}
 const act=e.target.closest('[data-action]');if(!act)return;const action=act.dataset.action,id=act.dataset.id;
 if(action==='close'){closeModal();return}if(action==='upload'){upload();return}if(action==='new-album'){newAlbum();return}if(action==='new-writing'){newWriting();return}if(action==='new-book'){newBook();return}if(action==='new-quote'){newQuote();return}if(action==='export'){exportData();return}
 if(action==='edit-note'){noteModal(id);return}
 if(action==='favorite'){const p=photos.find(x=>x.id===id);if(p){p.favorite=!p.favorite;openPhoto(id);toast(p.favorite?'Added to favorites':'Removed from favorites')}return}
 if(action==='download'){downloadPhoto(id);toast('Preparing photo download…');return}
 if(action==='save-note'){const p=photos.find(x=>x.id===id);if(p){p.title=$('#noteTitle').value.trim()||'Untitled memory';p.note=$('#noteText').value;closeModal();openPhoto(id);toast('Memory saved in this session.')}return}
 if(action==='save-photo'){const p=photos.find(x=>x.id===id);if(p){p.title=$('#photoTitle').value.trim()||'Untitled photo';p.album=$('#photoAlbum').value;closeModal();render();toast('Photo details updated in this session.')}return}
 if(action==='delete-photo'){if(confirm('Remove this photo from the current gallery session?')){photos=photos.filter(p=>p.id!==id);closeModal();render();toast('Photo removed from this session.')}return}
 if(action==='delete-selected'){if(confirm('Remove '+selectedIds.size+' selected photos from this session?')){photos=photos.filter(p=>!selectedIds.has(p.id));selectedIds.clear();render();toast('Selected photos removed.')}return}
 if(action==='selected-album'){simpleModal('Add selected photos to album','<div class="field"><label for="targetAlbum">Choose album</label><select id="targetAlbum" style="width:100%;background:#0a111a;border:1px solid #2a394c;border-radius:11px;color:var(--text);padding:12px">'+albums.map(a=>'<option>'+safe(a.name)+'</option>').join('')+'</select></div>','apply-album');return}
 if(action==='save-album'){const name=$('#aName').value.trim();if(!name){toast('Enter an album name first.');return}if(albums.some(a=>a.name.toLowerCase()===name.toLowerCase())){toast('That album already exists.');return}albums.push({name,cover:img.moon});closeModal();nav('Albums');toast('Album created.');return}
 if(action==='apply-album'){const name=$('#targetAlbum').value;photos.forEach(p=>{if(selectedIds.has(p.id))p.album=name});selectedIds.clear();closeModal();render();toast('Photos added to '+name+'.');return}
 if(action==='save-writing'||action==='save-writing-edit'){const title=$('#wTitle').value.trim(),body=$('#wBody').value.trim();if(!body){toast('Write a few words before saving.');return}const old=action==='save-writing-edit'?writings.find(w=>w.id===id):null;if(old){old.title=title;old.body=body}else writings.unshift({id:'w'+Date.now(),title,body,date:new Date().toLocaleDateString()});closeModal();render();toast('Writing saved in this session.');return}
 if(action==='save-book'||action==='save-book-edit'){const title=$('#bTitle').value.trim();if(!title){toast('Add a book title first.');return}const obj={title,author:$('#bAuthor').value.trim(),status:$('#bStatus').value,notes:$('#bNotes').value.trim()};const old=action==='save-book-edit'?books.find(b=>b.id===id):null;if(old)Object.assign(old,obj);else books.unshift({...obj,id:'b'+Date.now()});closeModal();render();toast('Book saved in this session.');return}
 if(action==='save-quote'){const text=$('#qText').value.trim();if(!text){toast('Add the quote first.');return}quotes.unshift({text,source:$('#qSource').value.trim(),page:$('#qPage').value.trim()});closeModal();render();toast('Quote saved in this session.');return}
});
$('#mainAction').addEventListener('click',()=>{if(activePage==='Photos'||activePage==='Favorites')upload();else if(activePage==='Albums')newAlbum();else if(activePage==="Writer's Corner")newWriting();else if(activePage==="Reader's Library")newBook();else if(activePage==='Quotes')newQuote();else if(activePage==='Settings')toast('Settings are being built in stages.');else toast('Choose a photo, note, book or quote to begin.')});
$('#uploadBtn').addEventListener('click',upload);
$('#fileInput').addEventListener('change',e=>{const files=[...e.target.files];files.forEach(file=>{if(!file.type.startsWith('image/'))return;const src=URL.createObjectURL(file);photos.unshift({id:'upload'+Date.now()+Math.random().toString(16).slice(2),title:file.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' '),src,date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),album:'',note:'',favorite:false,uploaded:true})});e.target.value='';nav('Photos');toast(files.length+' image(s) added for this session. Uploads are not backed up yet.')});
$('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value.trim();if(activePage!=='Photos'&&activePage!=='Favorites')activePage='Photos';render()});
$('#enterBtn').addEventListener('click',()=>$('#welcome').classList.add('dismissed'));
$('#welcomeAgain').addEventListener('click',()=>$('#welcome').classList.remove('dismissed'));
$('#profileBtn').addEventListener('click',()=>{openModal('<div class="modal-head"><h2>Your personal space</h2><button class="icon-btn" data-action="close">✕</button></div><div class="moon-mini" style="margin-bottom:12px">☾</div><h3 style="margin:0">Welcome to Moonlit Gallery</h3><p class="muted">This is the visual prototype. A secure account and cloud sync will be connected in a later stage.</p><button class="secondary" style="width:100%" id="profileWelcome">Replay moon welcome</button>');const b=$('#profileWelcome');if(b)b.addEventListener('click',()=>{closeModal();$('#welcome').classList.remove('dismissed')})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#globalSearch').focus()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-photo]')){e.preventDefault();openPhoto(e.target.dataset.photo)}});
render();
</script>
</body>
</html>
