/* Reader's Library: roomy book cards and a two-column detail view */
.book-shelf{display:flex;flex-direction:column;gap:18px}
.book-card{display:grid;grid-template-columns:124px minmax(0,1fr);gap:22px;padding:20px;border:1px solid #243247;border-radius:18px;background:linear-gradient(120deg,#121d2b,#0d141e 72%);box-shadow:0 8px 24px #00000012;min-width:0}
.book-cover{width:124px;min-height:172px;align-self:stretch;border-radius:12px;background:#1a293c;overflow:hidden;display:grid;place-items:center}
.book-cover img{width:100%;height:100%;min-height:172px;max-height:230px;object-fit:cover;display:block}
.book-summary{display:flex;flex-direction:column;gap:12px;min-width:0}
.book-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.book-title-wrap{min-width:0}.book-title-wrap h3{font-size:17px;line-height:1.35;margin:0;overflow-wrap:anywhere}.book-title-wrap p{font-size:12px;margin:5px 0 0;color:var(--muted)}
.book-note{color:#c0ccdd;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.7}
.book-card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid #202d3d}
.book-card-actions{display:flex;align-items:center;gap:9px}.book-card-actions button{white-space:nowrap}
.book-detail-layout{display:grid;grid-template-columns:minmax(220px,.78fr) minmax(0,1.22fr);gap:22px;align-items:start}
.book-detail-about,.book-detail-favorites{min-width:0}
.book-detail-about{padding:17px;border:1px solid #263548;border-radius:15px;background:#0c141f}
.book-detail-cover{height:190px;display:grid;place-items:center;background:#182538;border-radius:11px;overflow:hidden;margin-bottom:15px}
.book-detail-cover img{width:100%;height:100%;object-fit:contain;display:block}
.book-detail-about h3{margin:0;font-size:16px;overflow-wrap:anywhere}.book-detail-about>p{margin:5px 0 12px;font-size:12px}
.book-detail-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.book-detail-section-head h3{font-size:16px;margin:0}.book-detail-section-head p{font-size:11px;margin:3px 0 0}
.passage-list{display:flex;flex-direction:column;gap:13px}
.passage-card{display:grid;grid-template-columns:minmax(100px,145px) minmax(0,1fr);gap:13px;border:1px solid #263548;border-radius:13px;overflow:hidden;background:#0d1520;padding:10px;min-width:0}
.passage-image{width:100%;height:150px;object-fit:contain;background:#080d14;border-radius:8px;display:block}
.passage-no-image{height:100px;display:grid;place-items:center;background:#182538;border-radius:8px;font-size:24px;color:#b9cfff}
.passage-copy{min-width:0;padding:4px 2px}.passage-copy p{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;color:#d0d9e8}
.book-passage-empty{padding:30px 14px}.book-passage-empty p{font-size:12px}

let photos=[...seed], albums=[{name:'Nature',cover:img.mountain},{name:'Travel',cover:img.temple},{name:'Night skies',cover:img.moon}], writings=[], books=[], quotes=[], activePage='Photos', searchTerm='', photoSort='newest', albumSort='name', selectedPhoto=null, selectedIds=new Set(), toastTimer;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function setHead(title,subtitle,eyebrow='YOUR PERSONAL ARCHIVE'){ $('#pageTitle').textContent=title;$('#pageSubtitle').textContent=subtitle;$('#greetingEyebrow').textContent=eyebrow;$('#mainAction').textContent=({'Photos':'＋ Add photos','Albums':'＋ Create album',"Writer's Corner":'＋ New writing',"Reader's Library":'＋ Add book','Quotes':'＋ Save a quote','Connections':'＋ New connection','Favorites':'＋ Add photos','Settings':'Settings'}[activePage]||'＋ Create');}
function photoCard(p,i){return '<article class="photo-card photo-row-card '+(selectedIds.has(p.id)?'selected':'')+'" style="--i:'+i+'" data-photo="'+safe(p.id)+'" tabindex="0" aria-label="Photo '+safe(p.title)+'"><button class="photo-check" data-select="'+safe(p.id)+'" aria-label="Select photo">'+(selectedIds.has(p.id)?'✓':'')+'</button><img class="photo-row-thumb" src="'+safe(p.src)+'" alt="'+safe(p.title)+'" loading="lazy"><div class="photo-row-info"><h3>'+safe(p.title)+'</h3><p class="photo-row-meta">'+safe(p.date)+' · '+safe(p.album||'Unsorted')+'</p><p class="photo-row-story">'+safe(p.note||'')+'</p></div><div class="photo-row-actions"><button class="secondary" data-open="'+safe(p.id)+'">Open</button><button class="secondary" data-edit-photo="'+safe(p.id)+'" aria-label="Edit '+safe(p.title)+'">✎ Edit</button></div></article>'}
function photoSection(list){if(!list.length)return '<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg><div>No photos here yet</div><p>Add photos from your device to begin your collection.</p><button class="primary" data-action="upload">＋ Add photos</button></div>';const groups={};list.forEach(p=>(groups[p.date]??=[]).push(p));return Object.entries(groups).map(([date,items])=>'<div class="date-heading">'+safe(date)+'</div><div class="photo-grid">'+items.map((p,i)=>photoCard(p,i)).join('')+'</div>').join('')}
function renderPhotos(){let list=photos.filter(p=>activePage!=='Favorites'||p.favorite);if(searchTerm){const q=searchTerm.toLowerCase();list=list.filter(p=>(p.title+' '+p.note+' '+p.album+' '+p.date).toLowerCase().includes(q))}list.sort((a,b)=>{if(photoSort==='title')return String(a.title||'').localeCompare(String(b.title||''));if(photoSort==='album')return String(a.album||'').localeCompare(String(b.album||''))||String(a.title||'').localeCompare(String(b.title||''));const da=Date.parse(a.date)||0,db=Date.parse(b.date)||0;return photoSort==='oldest'?da-db:db-da});const visibleIds=list.map(p=>p.id);const selectedVisible=visibleIds.filter(id=>selectedIds.has(id)).length;return '<div class="toolbar"><div><h2>'+ (activePage==='Favorites'?'Favorite photos':'All photos')+' <span class="muted" style="font-size:12px;font-weight:400">· '+list.length+'</span></h2>'+(selectedVisible?'<p class="selection-summary">'+selectedVisible+' selected</p>':'')+'</div><div class="toolbar-right selection-toolbar"><button class="secondary" data-action="select-all-visible">'+(visibleIds.length&&selectedVisible===visibleIds.length?'Clear selection':'Select all')+'</button>'+(selectedVisible?'<button class="secondary" data-action="favorite-selected">♥ Favorite</button><button class="secondary" data-action="selected-album">Add to album</button><button class="secondary" data-action="clear-selection">Clear</button><button class="secondary" data-action="delete-selected">Delete ('+selectedVisible+')</button>':'')+'</div></div><div class="sort-row"><label class="sort-label" for="photoSortSelect">Sort photos</label><select id="photoSortSelect" class="sort-select"><option value="newest" '+(photoSort==='newest'?'selected':'')+'>Newest first</option><option value="oldest" '+(photoSort==='oldest'?'selected':'')+'>Oldest first</option><option value="title" '+(photoSort==='title'?'selected':'')+'>Title A–Z</option><option value="album" '+(photoSort==='album'?'selected':'')+'>Album A–Z</option></select></div>'+photoSection(list)}
function renderAlbums(){let list=albums.filter(a=>!searchTerm||String(a.name||'').toLowerCase().includes(searchTerm.toLowerCase()));list.sort((a,b)=>{const ac=photos.filter(p=>p.album===a.name).length,bc=photos.filter(p=>p.album===b.name).length;if(albumSort==='most')return bc-ac||String(a.name).localeCompare(String(b.name));if(albumSort==='fewest')return ac-bc||String(a.name).localeCompare(String(b.name));return String(a.name||'').localeCompare(String(b.name||''))});return '<section class="album-page-intro"><div><div class="eyebrow">YOUR PERSONAL COLLECTION</div><h2 class="album-page-title">Albums, <span>beautifully kept.</span></h2><p class="album-page-subtitle">A little place for every memory.</p></div><div class="album-total"><span>'+albums.length+'</span><small>'+(albums.length===1?'collection':'collections')+'</small></div></section><div class="toolbar album-toolbar"><h2>Your collections <span class="muted" style="font-size:12px;font-weight:400">· '+list.length+'</span></h2><div class="toolbar-right"><button class="primary album-create-button" data-action="new-album">＋ Create album</button></div></div><div class="sort-row album-sort-row"><label class="sort-label" for="albumSortSelect">Sort albums</label><select id="albumSortSelect" class="sort-select"><option value="name" '+(albumSort==='name'?'selected':'')+'>Name A–Z</option><option value="most" '+(albumSort==='most'?'selected':'')+'>Most photos</option><option value="fewest" '+(albumSort==='fewest'?'selected':'')+'>Fewest photos</option></select></div><div class="albums-grid">'+(list.length?list.map(a=>{const n=photos.filter(p=>p.album===a.name).length;return '<article class="album-card" data-album="'+safe(a.name)+'"><div class="album-cover-wrap"><img class="album-cover" src="'+safe(a.cover)+'" alt="Cover of '+safe(a.name)+'" loading="lazy"><span class="album-cover-shade"></span><span class="album-open-mark" aria-hidden="true">↗</span></div><div class="album-info"><div class="album-info-copy"><h3>'+safe(a.name)+'</h3><p><span class="album-count-dot"></span>'+n+' '+(n===1?'photo':'photos')+'</p></div></div></article>'}).join(''):'<div class="empty-state album-empty"><div class="album-empty-icon">✧</div><h3>'+(searchTerm?'No albums match your search':'Your first collection starts here')+'</h3><p>'+(searchTerm?'Try another album name.':'Create an album for travel, friends, nature, or anything worth keeping.')+'</p>'+(searchTerm?'':'<button class="primary" data-action="new-album">＋ Create your first album</button>')+'</div>')+'</div>'}

function renderBooks(){const groups=['All books','Philosophy','Science','Literature','Spirituality','History','Other'];const current=window.moonlitBookCollection||'All books';const list=books.filter(b=>current==='All books'||(b.collection||'Unsorted')===current);return '<div class="toolbar"><div><h2>Your reading shelf</h2><p class="muted" style="margin:3px 0">Organize books into your own collections.</p></div><button class="primary" data-action="new-book">＋ Add book</button></div><div class="reader-collections" style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px">'+groups.map(g=>'<button class="secondary '+(current===g?'active':'')+'" data-book-collection="'+safe(g)+'">'+safe(g)+'</button>').join('')+'</div><div class="book-shelf">'+(list.length?list.map(b=>'<article class="book-card"><div class="book-cover">'+(b.cover?'<img src="'+safe(b.cover)+'" alt="Cover of '+safe(b.title)+'">':'<span class="feature-icon">▤</span>')+'</div><div class="book-summary"><div class="book-card-top"><div class="book-title-wrap"><h3>'+safe(b.title)+'</h3><p>'+safe(b.author||'Author not added')+'</p></div><span class="tag">'+safe(b.status||'Want to read')+'</span></div><p class="muted" style="font-size:12px">Collection: '+safe(b.collection||'Unsorted')+'</p><p class="book-note">'+safe(b.notes||'No reading notes yet.')+'</p><div class="book-card-bottom"><span class="muted">'+(b.passages||[]).length+' favorite '+((b.passages||[]).length===1?'part':'parts')+'</span><div class="book-card-actions"><button class="secondary" data-edit-book="'+safe(b.id)+'">Edit</button><button class="primary" data-view-book="'+safe(b.id)+'">View book ↗</button></div></div></div></article>').join(''):'<div class="empty-state"><div class="serif" style="font-size:24px;color:#e2eaff">Nothing in this collection yet.</div><p>Add a book or choose another collection.</p><button class="primary" data-action="new-book">Add a book</button></div>')+'</div>'}
function viewBook(id){const b=books.find(x=>x.id===id);if(!b)return;const passages=b.passages||[];openModal('<div class="modal-head"><div><div class="eyebrow">YOUR READING SHELF</div><h2 style="margin-top:4px">'+safe(b.title)+'</h2></div><button class="icon-btn" data-action="close" aria-label="Close">✕</button></div><div class="book-detail-layout"><section class="book-detail-about"><div class="book-detail-cover">'+(b.cover?'<img src="'+safe(b.cover)+'" alt="Cover of '+safe(b.title)+'">':'<span class="feature-icon">▤</span>')+'</div><h3>'+safe(b.title)+'</h3><p class="muted">'+safe(b.author||'Author not added')+'</p><span class="tag">'+safe(b.status||'Want to read')+'</span><div class="note-box" style="margin-top:16px"><strong>My thoughts</strong><p>'+(b.notes?safe(b.notes):'No thoughts added yet.')+'</p></div><button class="secondary" style="width:100%;margin-top:12px" data-edit-book="'+safe(b.id)+'">✎ Edit book details</button></section><section class="book-detail-favorites"><div class="book-detail-section-head"><div><h3>Favorite parts</h3><p class="muted">'+passages.length+' saved '+(passages.length===1?'passage':'passages')+'</p></div><button class="primary" data-edit-book="'+safe(b.id)+'">＋ Add part</button></div>'+(passages.length?'<div class="passage-list">'+passages.map((p,i)=>'<article class="passage-card">'+(p.image?'<img src="'+safe(p.image)+'" alt="Favorite page '+(p.page?safe(p.page):'')+'" class="passage-image">':'<div class="passage-no-image">✧</div>')+'<div class="passage-copy"><span class="eyebrow">'+(p.page?'PAGE '+safe(p.page):'FAVORITE PART '+(i+1))+'</span><p>'+(p.thoughts?safe(p.thoughts):'A passage to remember.')+'</p></div></article>').join('')+'</div>':'<div class="empty-state book-passage-empty"><div class="serif" style="font-size:21px;color:#e2eaff">Keep a line that stays with you.</div><p>Add a page photo and a note about why it matters.</p><button class="secondary" data-edit-book="'+safe(b.id)+'">＋ Add favorite part</button></div>')+'<div class="reader-panel" style="margin-top:18px;padding:14px;border:1px solid #263548;border-radius:14px;background:#0c141f"><h3 style="margin:0 0 6px">Tap-to-define dictionary</h3><p class="muted" style="font-size:12px">Look up an English word here without leaving your book details.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="dictionaryWord" placeholder="Type a word" style="flex:1;min-width:140px;background:#0a111a;border:1px solid #2a394c;border-radius:10px;color:var(--text);padding:11px"><button class="secondary" data-action="define-word">Define</button></div><div id="dictionaryResult" class="muted" aria-live="polite" style="margin-top:10px"></div></div>'+'</section></div>',true)}
function renderQuotes(){return '<div class="toolbar"><h2>Words worth keeping</h2><button class="primary" data-action="new-quote">＋ Save a quote</button></div>'+(quotes.length?quotes.map(q=>'<div class="quote-card"><blockquote>“'+safe(q.text)+'”</blockquote><cite>— '+safe(q.source||'A thought to remember')+(q.page?' · p. '+safe(q.page):'')+'</cite></div>').join(''):'<div class="empty-state"><div class="serif" style="font-size:24px;color:#e2eaff">Keep the sentences that find you.</div><p>Save a quote with its book, author and page number.</p><button class="primary" data-action="new-quote">Save a quote</button></div>')}

function renderSettings(){return '<div class="toolbar"><h2>Your space</h2></div><section class="storage-panel"><div class="storage-panel-head"><div><div class="eyebrow">SHARED CLOUD</div><h2>Cloud storage</h2><p class="muted">Used by every Moonlit Gallery account, including yours.</p></div><span class="storage-cloud-icon">☁</span></div><div class="storage-total" id="sharedStorageTotal">Checking…</div><div class="storage-track"><div id="sharedStorageBar" class="storage-track-fill" style="width:0%"></div></div><div class="storage-scale"><span id="sharedStorageUsed">Calculating shared usage</span><span id="sharedStorageLimit">1 GB allowance</span></div><div class="storage-foot"><span id="sharedStorageRemaining">Connecting to Supabase…</span><button class="secondary" data-action="refresh-storage">↻ Refresh</button></div><p class="storage-note" id="sharedStorageNote">Shows the combined size of files in the Moonlit Photos bucket. Supabase dashboard usage may differ slightly.</p></section><div class="feature-grid"><article class="feature-card"><div class="feature-icon">☾</div><h3>Moonlit welcome</h3><p>Return to the night-sky introduction.</p><button class="secondary" id="settingsWelcome">Preview welcome screen</button></article><article class="feature-card"><div class="feature-icon">⇧</div><h3>Photo library</h3><p>'+photos.length+' photos in this current browser session. Sample images are included as visual placeholders.</p><button class="secondary" data-action="upload">Add photos</button></article><article class="feature-card"><div class="feature-icon">⌁</div><h3>Data & privacy</h3><p>Your cloud photos are stored privately in Supabase. Only a combined storage total is shared on this dashboard.</p><span class="tag">Private files</span></article><article class="feature-card"><div class="feature-icon">✦</div><h3>Export your notes</h3><p>Download your writing, books and quotes from this session as a JSON file.</p><button class="secondary" data-action="export">Export data</button></article></div>'}
function render(){setHead(...( {Photos:['A little universe of yours.','Keep the moments. Keep the meaning.'],Albums:['Collections for every kind of memory.','A different shelf for every story.'],Favorites:['The ones you return to.','Little things worth keeping close.'],"Writer's Corner":['Words that belong to you.','Drafts, fragments, poems and possibilities.'],"Reader's Library":['A shelf for your inner world.','Books read, books loved, thoughts kept.'],Quotes:['Sentences that stay with you.','Keep the words that opened a door.'],Connections:['Follow the threads between ideas.','Memories, books and thoughts can belong together.'],Settings:['Make this space your own.','A few details about your personal archive.']}[activePage]||['A little universe of yours.','Keep the moments. Keep the meaning.']));const c=$('#content');if(activePage==='Photos'||activePage==='Favorites')c.innerHTML=renderPhotos();else if(activePage==='Albums')c.innerHTML=renderAlbums();else if(activePage==="Writer's Corner")c.innerHTML=renderWriting();else if(activePage==="Reader's Library")c.innerHTML=renderBooks();else if(activePage==='Quotes')c.innerHTML=renderQuotes();else if(activePage==='Connections')c.innerHTML=renderConnections();else c.innerHTML=renderSettings();if(activePage==='Settings'&&moonlitUser)loadSharedStorageUsage();$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===activePage));}

function openPhoto(id){const p=photos.find(x=>x.id===id);if(!p)return;selectedPhoto=id;const list=photos.filter(x=>activePage!=='Favorites'||x.favorite).filter(x=>!searchTerm||(x.title+' '+x.note+' '+x.album+' '+x.date).toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>{if(photoSort==='title')return String(a.title||'').localeCompare(String(b.title||''));if(photoSort==='album')return String(a.album||'').localeCompare(String(b.album||''))||String(a.title||'').localeCompare(String(b.title||''));const da=Date.parse(a.date)||0,db=Date.parse(b.date)||0;return photoSort==='oldest'?da-db:db-da});const index=list.findIndex(x=>x.id===id);const navBtn=(delta,disabled)=>'<button class="viewer-nav-button" data-viewer-step="'+delta+'" aria-label="'+(delta<0?'Previous photo':'Next photo')+'" '+(disabled?'disabled':'')+'>'+ (delta<0?'‹':'›')+'</button>';openModal('<div class="immersive-viewer" data-viewer-id="'+safe(p.id)+'"><div class="immersive-topbar"><div class="immersive-photo-label"><span class="eyebrow">MOONLIT GALLERY</span><span class="immersive-counter">'+(index+1)+' / '+list.length+'</span></div><div class="immersive-tools"><button class="viewer-tool" data-viewer-zoom="out" aria-label="Zoom out" title="Zoom out">−</button><button class="viewer-tool zoom-readout" data-viewer-zoom="reset" aria-label="Reset zoom">100%</button><button class="viewer-tool" data-viewer-zoom="in" aria-label="Zoom in" title="Zoom in">＋</button><button class="viewer-tool viewer-close" data-action="close" aria-label="Close viewer" title="Close">✕</button></div></div><div class="immersive-stage" data-viewer-stage>'+navBtn(-1,index<=0)+'<div class="immersive-image-viewport" data-viewer-viewport><img class="immersive-image" data-viewer-image src="'+safe(p.src)+'" alt="'+safe(p.title)+'" draggable="false"></div>'+navBtn(1,index<0||index>=list.length-1)+'<div class="immersive-caption"><strong>'+safe(p.title)+'</strong><span>'+safe(p.date)+' · '+safe(p.album||'Unsorted')+'</span></div></div>< function initImmersiveViewer(list,index){let zoom=1,tx=0,ty=0,startX=0,startY=0,downX=0,downY=0,moved=false;const root=$('#modalRoot'),viewport=root.querySelector('[data-viewer-viewport]'),image=root.querySelector('[data-viewer-image]'),readout=root.querySelector('.zoom-readout');if(!viewport||!image)return;function apply(){image.style.transform='translate('+tx+'px,'+ty+'px) scale('+zoom+')';image.style.cursor=zoom>1?'grab':'zoom-in';readout.textContent=Math.round(zoom*100)+'%'}function reset(){zoom=1;tx=0;ty=0;apply()}root.querySelectorAll('[data-viewer-zoom]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.viewerZoom;if(v==='reset')reset();else{zoom=Math.max(1,Math.min(4,zoom+(v==='in'?.5:-.5)));if(zoom===1){tx=0;ty=0}apply()}}));root.querySelectorAll('[data-viewer-step]').forEach(b=>b.addEventListener('click',()=>{const next=index+Number(b.dataset.viewerStep);if(next>=0&&next<list.length)openPhoto(list[next].id)}));image.addEventListener('click',e=>{if(moved){moved=false;return}if(zoom===1){zoom=2}else{zoom=1;tx=0;ty=0}apply()});viewport.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;downX=tx;downY=ty;moved=false;try{viewport.setPointerCapture(e.pointerId)}catch(_){} });viewport.addEventListener('pointermove',e=>{if(e.buttons!==1)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;if(zoom>1){tx=downX+dx;ty=downY+dy;apply()}});viewport.addEventListener('pointerup',e=>{if(zoom===1&&Math.abs(e.clientX-startX)>55&&Math.abs(e.clientY-startY)<90){const step=e.clientX<startX?1:-1,next=index+step;if(next>=0&&next<list.length)openPhoto(list[next].id)} });let touchStart=null;viewport.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});viewport.addEventListener('touchend',e=>{if(!touchStart||zoom>1)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.abs(dx)>55&&Math.abs(dy)<90){const next=index+(dx<0?1:-1);if(next>=0&&next<list.length)openPhoto(list[next].id)}touchStart=null},{passive:true});apply()}

function renderUploadQueue(){
 const total=uploadQueueFiles.reduce((n,f)=>n+f.size,0);
 openModal('<div class="modal-head"><div><div class="eyebrow">YOUR PRIVATE GALLERY</div><h2 style="margin:3px 0 0">Add memories</h2></div><button class="icon-btn" data-action="close" aria-label="Close">✕</button></div><p class="upload-modal-intro">Choose the moments you want to keep. You can review everything before it goes to your private cloud.</p><div class="upload-drop" id="uploadDrop"><div class="upload-cloud-icon"><svg viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></div><h3>Bring your memories in</h3><p>JPG, PNG, WebP and other image formats</p><button class="secondary" id="uploadMore" type="button">＋ Choose photos</button></div><div class="upload-summary"><span id="uploadCount">'+uploadQueueFiles.length+' photo'+(uploadQueueFiles.length===1?'':'s')+' selected</span><span>'+uploadFileSize(total)+' total</span></div><div class="upload-previews" id="uploadPreviews">'+uploadQueueFiles.map((f,i)=>'<div class="upload-preview"><img src="'+URL.createObjectURL(f)+'" alt="'+safe(f.name)+'"><span class="upload-file-name">'+safe(f.name)+'</span><button type="button" data-remove-upload="'+i+'" aria-label="Remove '+safe(f.name)+'">×</button></div>').join('')+'</div><div id="uploadProgressArea" hidden><div class="upload-progress-wrap"><div class="upload-progress-bar" id="uploadProgressBar"></div></div><div class="upload-status" id="uploadStatus">Getting ready…</div></div><div class="upload-footer"><button class="secondary" id="uploadCancel" type="button">Cancel</button><button class="primary" id="uploadStart" type="button" '+(!uploadQueueFiles.length?'disabled':'')+'>Upload '+uploadQueueFiles.length+' photo'+(uploadQueueFiles.length===1?'':'s')+' ↗</button></div>',true);

async function performQueuedUpload(){

 if(!configureSupabase())return;
 const {data:sessionData,error:sessionError}=await moonlitClient.auth.getSession();
 if(sessionError||!sessionData.session?.user){moonlitUser=null;toast('Your login session is not available. Please sign in again.');showAccount();return}
 moonlitUser=sessionData.session.user;
 const files=[...uploadQueueFiles],start=$('#uploadStart'),cancel=$('#uploadCancel'),area=$('#uploadProgressArea'),bar=$('#uploadProgressBar'),status=$('#uploadStatus');
 start.disabled=true;cancel.disabled=true;$('#uploadMore').disabled=true;area.hidden=false;
 let uploaded=0,failed=[];
 for(let i=0;i<files.length;i++){
  const file=files[i];status.textContent='Uploading '+(i+1)+' of '+files.length+' · '+file.name;
  try{const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=moonlitUser.id+'/'+Date.now()+'-'+i+'-'+safeName;const {error}=await moonlitClient.storage.from('moonlit-photos').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;uploaded++}
  catch(err){failed.push(file.name);status.textContent='Could not upload '+file.name+' · '+(err.message||'Please try again')}
  bar.style.width=Math.round(((i+1)/files.length)*100)+'%';
 }
 if(uploaded){await loadCloudPhotos()}
 status.textContent=failed.length?uploaded+' uploaded · '+failed.length+' failed':'All '+uploaded+' photos are safely uploaded.';
 start.textContent=failed.length?'Close':'Done ✓';start.disabled=false;cancel.disabled=false;cancel.textContent='Close';
 start.onclick=()=>{uploadQueueFiles=[];closeModal();if(uploaded)toast(uploaded+' photo(s) saved to your private cloud gallery.');if(failed.length)toast(failed.length+' photo(s) could not be uploaded. Try those again.')};
 if(!failed.length)$('#uploadMore').disabled=true;
}

 if(!email||!password){toast('Enter your email and password.');return}
 if(password.length<6){toast('Use a password with at least 6 characters.');return}

const MOONLIT_SHARED_STORAGE_LIMIT=1000000000;
function formatStorageBytes(bytes){const n=Math.max(0,Number(bytes)||0);if(n<1000)return n+' B';if(n<1000000)return (n/1000).toFixed(n<10000?1:0)+' KB';if(n<1000000000)return (n/1000000).toFixed(n<10000000?2:1)+' MB';return (n/1000000000).toFixed(2)+' GB'}
async function loadSharedStorageUsage(){
 const total=$('#sharedStorageTotal');if(!total)return;
 if(!moonlitClient||!moonlitUser){total.textContent='Sign in to view usage';$('#sharedStorageUsed').textContent='Sign-in required';$('#sharedStorageRemaining').textContent='';$('#sharedStorageNote').textContent='Sign in to request the shared storage total.';return}
 total.textContent='Loading shared usage…';const refresh=$('[data-action="refresh-storage"]');if(refresh){refresh.disabled=true;refresh.textContent='Loading…'}
 try{const {data,error}=await moonlitClient.rpc('moonlit_shared_storage_usage');if(error)throw error;const bytes=Number(data)||0,limit=MOONLIT_SHARED_STORAGE_LIMIT,remaining=Math.max(0,limit-bytes),pct=Math.min(100,bytes/limit*100);total.textContent=formatStorageBytes(bytes)+' / 1 GB';$('#sharedStorageBar').style.width=pct.toFixed(2)+'%';$('#sharedStorageUsed').textContent=formatStorageBytes(bytes)+' used by everyone';$('#sharedStorageLimit').textContent='1 GB shared allowance';$('#sharedStorageRemaining').textContent=remaining?formatStorageBytes(remaining)+' remaining': 'Shared allowance reached';$('#sharedStorageNote').textContent='Combined file sizes in the Moonlit Photos bucket, across all accounts. This is not a per-user quota; the Supabase organization usage page remains the authority for billed storage.'}
 catch(err){total.textContent='Usage unavailable';$('#sharedStorageBar').style.width='0%';$('#sharedStorageUsed').textContent='Could not read shared usage';$('#sharedStorageRemaining').textContent='Check connection or permissions';$('#sharedStorageNote').textContent='The storage request failed. Confirm the moonlit_shared_storage_usage SQL function exists and grants EXECUTE to authenticated users, then check your connection and sign-in. Details: '+(err.message||'RPC request failed')}
 finally{if(refresh){refresh.disabled=false;refresh.textContent='↻ Refresh'}}
}
async function loadCloudPhotos(){
 if(!moonlitClient||!moonlitUser)return;
 const {data,error}=await moonlitClient.storage.from('moonlit-photos').list(moonlitUser.id,{limit:100,sortBy:{column:'created_at',order:'desc'}});

 const cloud=[];

}
